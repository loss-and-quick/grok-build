[package]
license = "Apache-2.0"
name = "xai-grok-sampling-types"
version = "0.1.0"
edition.workspace = true
description = "Pure data types for the xAI sampling / chat-completion API layer"

[dependencies]
async-openai = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
xai-circuit-breaker = { workspace = true }
xai-grok-compaction = { path = "../../common/xai-grok-compaction" }
xai-grok-tools = { path = "../xai-grok-tools" }

[dev-dependencies]
assert_matches = { workspace = true }
# Test-only: pins `ReasoningEffort` against the tool-facing vocabulary in
# `xai_tool_types::REASONING_EFFORT_VALUES`. That crate cannot depend on this
# one (this one already depends on xai-grok-tools, so the edge would be a
# cycle), so the two lists are kept in step by a test rather than by the type
# system. Dev-only, so no cycle and nothing extra in the shipped graph.
xai-tool-types = { workspace = true }

[lints]
workspace = true
